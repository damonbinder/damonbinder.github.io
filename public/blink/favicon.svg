<!-- The in-game reticle. Four strokes with a centre gap is the one mark from
     this game that survives being drawn at 16px; an eye or a corridor doesn't. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0f1115"/>
  <g stroke="#4ade80" stroke-width="6" stroke-linecap="round">
    <path d="M32 11V23"/>
    <path d="M32 41V53"/>
    <path d="M11 32H23"/>
    <path d="M41 32H53"/>
  </g>
</svg>
