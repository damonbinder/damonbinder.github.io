<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blink</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Blink</h1>
    </header>

    <div class="board">
      <!-- Both backing stores are resized to RENDER_SCALE x this in JS; the
           attributes just fix the aspect ratio before the module runs. -->
      <canvas id="game" width="960" height="720"></canvas>
      <canvas id="hud" width="960" height="720"></canvas>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-inner">
          <div id="overlayTitle">Game over</div>
          <div id="overlaySub">Press space to restart</div>
        </div>
      </div>

      <div id="startOverlay" class="overlay">
        <div class="overlay-inner">
          <button id="startBtn">Start</button>
          <div id="startPrompt" class="start-prompt hidden">Blink to start</div>
          <div id="camError" class="cam-error hidden"></div>
        </div>
      </div>
    </div>

    <!-- Score/health/ammo/weapon/wave are drawn on the canvas itself now; what
         is left down here is calibration readout, so the whole strip is
         debug-only and the default view is just the board. -->
    <div class="hud debug-only">
      <div class="stat gaze-stat debug-only">
        <span class="label">Track</span>
        <span id="trackState" class="value gaze-unknown">–</span>
      </div>
      <div class="stat debug-only">
        <span class="label">Blinks</span>
        <span id="blinkCount" class="value">0</span>
      </div>
      <div class="stat gaze-stat debug-only">
        <span class="label">Mouth</span>
        <span id="mouthState" class="value gaze-unknown">–</span>
      </div>
      <div class="stat debug-only">
        <span class="label">Swings</span>
        <span id="swingCount" class="value">0</span>
      </div>
    </div>

    <div class="panels debug-only">
      <div class="panel camera-panel">
        <div class="panel-title">Camera</div>
        <div class="video-box">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="videoOverlay"></canvas>
        </div>
        <label class="toggle">
          <input type="checkbox" id="showCamera" checked />
          Show camera preview
        </label>
      </div>

      <div class="panel tuning-panel">
        <div class="panel-title">Sensitivity</div>
        <label class="slider-row">
          <span>Look range (horizontal) <span id="yawVal">15</span>°</span>
          <input type="range" id="yawSlider" min="10" max="60" value="15" />
        </label>
        <label class="slider-row">
          <span>Look range (vertical) <span id="pitchVal">15</span>°</span>
          <input type="range" id="pitchSlider" min="10" max="50" value="15" />
        </label>
        <label class="slider-row">
          <span>Tracking smoothness <span id="smoothVal">60</span>%</span>
          <input type="range" id="smoothSlider" min="2" max="60" value="60" />
        </label>
        <label class="slider-row">
          <span>Blink threshold <span id="threshVal">20</span>%</span>
          <input type="range" id="threshSlider" min="10" max="90" value="20" />
        </label>
        <label class="slider-row">
          <span>Frames to confirm <span id="debounceVal">1</span></span>
          <input type="range" id="debounceSlider" min="1" max="8" value="1" />
        </label>
        <label class="slider-row">
          <span>Mouth-open threshold <span id="mouthThreshVal">35</span>%</span>
          <input type="range" id="mouthThreshSlider" min="10" max="90" value="35" />
        </label>
        <label class="slider-row">
          <span>Mouth frames to confirm <span id="mouthDebounceVal">1</span></span>
          <input type="range" id="mouthDebounceSlider" min="1" max="8" value="1" />
        </label>
        <label class="toggle">
          <input type="checkbox" id="invertX" checked />
          Invert horizontal
        </label>
        <label class="toggle">
          <input type="checkbox" id="invertY" />
          Invert vertical
        </label>
        <label class="toggle">
          <input type="checkbox" id="debugToggle" />
          Show debug scores
        </label>
        <div id="debugReadout" class="debug-readout hidden"></div>
        <div class="fallback-row">
          <button id="fallbackBtn" class="link-btn">No camera? Use mouse/click instead</button>
        </div>
      </div>
    </div>

    <p class="hint">Arrow keys or WASD to move. Space to pause. R cycles weapon.</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
