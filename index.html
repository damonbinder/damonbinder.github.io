<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blink</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Blink</h1>
    </header>

    <div class="board">
      <!-- Both backing stores are resized to RENDER_SCALE x this in JS; the
           attributes just fix the aspect ratio before the module runs. -->
      <canvas id="game" width="960" height="720"></canvas>
      <canvas id="hud" width="960" height="720"></canvas>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-inner">
          <div id="overlayTitle">Game over</div>
          <div id="overlaySub">Press space to restart</div>
        </div>
      </div>

      <div id="startOverlay" class="overlay">
        <div class="overlay-inner">
          <button id="startBtn">Start</button>
          <div id="startPrompt" class="start-prompt hidden">Blink to start</div>
          <div id="camError" class="cam-error hidden"></div>
        </div>
      </div>
    </div>

    <!-- Score/health/ammo/weapon/wave are drawn on the canvas itself now; what
         is left down here is calibration readout, so the whole strip is
         debug-only and the default view is just the board. -->
    <div class="hud debug-only">
      <div class="stat gaze-stat debug-only">
        <span class="label">Track</span>
        <span id="trackState" class="value gaze-unknown">–</span>
      </div>
      <div class="stat debug-only">
        <span class="label">Blinks</span>
        <span id="blinkCount" class="value">0</span>
      </div>
      <div class="stat gaze-stat debug-only">
        <span class="label">Mouth</span>
        <span id="mouthState" class="value gaze-unknown">–</span>
      </div>
      <div class="stat debug-only">
        <span class="label">Swings</span>
        <span id="swingCount" class="value">0</span>
      </div>
      <div class="stat gaze-stat debug-only">
        <span class="label">Hand</span>
        <span id="handState" class="value gaze-unknown">–</span>
      </div>
      <div class="stat debug-only">
        <span class="label">FPS</span>
        <span id="perf" class="value">–</span>
      </div>
    </div>

    <div class="panels debug-only">
      <div class="panel camera-panel">
        <div class="panel-title">Camera</div>
        <div class="video-box">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="videoOverlay"></canvas>
          <!-- Separate from videoOverlay: the face box is redrawn at video
               rate and would erase the hand skeleton between hand frames. -->
          <canvas id="handOverlay"></canvas>
        </div>
        <label class="toggle">
          <input type="checkbox" id="showCamera" checked />
          Show camera preview
        </label>
      </div>

      <div class="panel tuning-panel">
        <div class="panel-title">Sensitivity</div>
        <label class="slider-row">
          <span>Look range (horizontal) <span id="yawVal">15</span>°</span>
          <input type="range" id="yawSlider" min="10" max="60" value="15" />
        </label>
        <label class="slider-row">
          <span>Look range (vertical) <span id="pitchVal">15</span>°</span>
          <input type="range" id="pitchSlider" min="10" max="50" value="15" />
        </label>
        <label class="slider-row">
          <span>Tracking smoothness <span id="smoothVal">60</span>%</span>
          <input type="range" id="smoothSlider" min="2" max="60" value="60" />
        </label>
        <label class="slider-row">
          <span>Blink threshold <span id="threshVal">20</span>%</span>
          <input type="range" id="threshSlider" min="10" max="90" value="20" />
        </label>
        <label class="slider-row">
          <span>Frames to confirm <span id="debounceVal">1</span></span>
          <input type="range" id="debounceSlider" min="1" max="8" value="1" />
        </label>
        <label class="slider-row">
          <span>Mouth-open threshold <span id="mouthThreshVal">35</span>%</span>
          <input type="range" id="mouthThreshSlider" min="10" max="90" value="35" />
        </label>
        <label class="slider-row">
          <span>Mouth frames to confirm <span id="mouthDebounceVal">1</span></span>
          <input type="range" id="mouthDebounceSlider" min="1" max="8" value="1" />
        </label>
        <label class="toggle">
          <input type="checkbox" id="invertX" checked />
          Invert horizontal
        </label>
        <label class="toggle">
          <input type="checkbox" id="invertY" />
          Invert vertical
        </label>
        <label class="toggle">
          <input type="checkbox" id="invertHands" />
          Invert hand left/right
        </label>
        <label class="toggle">
          <input type="checkbox" id="debugToggle" />
          Show debug scores
        </label>
        <div id="debugReadout" class="debug-readout hidden"></div>
        <div class="fallback-row">
          <button id="fallbackBtn" class="link-btn">No camera? Use mouse/click instead</button>
        </div>
      </div>

      <!-- Needs both flags: ?debug=1 strips debug-only, ?hands=1 strips
           hands-only, so the panel is hidden unless hand steering is
           actually running. -->
      <div class="panel hand-panel debug-only hands-only">
        <div class="panel-title">Hand steering</div>
        <label class="slider-row">
          <span>Scheme</span>
          <select id="handModeSelect">
            <option value="wheel" selected>Steering wheel (two hands)</option>
            <option value="thumb">Thumb direction (one hand)</option>
          </select>
        </label>
        <div class="calibrate-row">
          <button id="calibrateHands" class="link-btn"></button>
          <span id="calibrateResult" class="calibrate-result"></span>
        </div>
        <!-- Not mode-specific: this is what hand steering costs in frame time,
             at roughly 12ms of blocking inference per detection. -->
        <label class="slider-row">
          <span>Detections per second <span id="handHzVal">20</span></span>
          <input type="range" id="handHzSlider" min="5" max="30" value="20" />
        </label>

        <div class="wheel-only">
          <label class="slider-row">
            <span>Tilt deadzone <span id="handTiltDeadVal">8</span>°</span>
            <input type="range" id="handTiltDeadSlider" min="0" max="30" value="8" />
          </label>
          <label class="slider-row">
            <span>Tilt for full strafe <span id="handTiltRangeVal">26</span>°</span>
            <input type="range" id="handTiltRangeSlider" min="10" max="80" value="26" />
          </label>
          <label class="slider-row">
            <span>Raise deadzone <span id="handRaiseDeadVal">5</span>%</span>
            <input type="range" id="handRaiseDeadSlider" min="0" max="25" value="5" />
          </label>
          <label class="slider-row">
            <span>Raise for full speed <span id="handRaiseRangeVal">12</span>%</span>
            <input type="range" id="handRaiseRangeSlider" min="5" max="45" value="12" />
          </label>
          <label class="slider-row">
            <span>Speed on leaving deadzone <span id="handMinSpeedVal">60</span>%</span>
            <input type="range" id="handMinSpeedSlider" min="0" max="100" value="60" />
          </label>
        </div>

        <div class="thumb-only">
          <label class="slider-row">
            <span>Angle offset <span id="handOffsetVal">0</span>°</span>
            <input type="range" id="handOffsetSlider" min="-90" max="90" value="0" />
          </label>
          <label class="slider-row">
            <span>Left/right sector <span id="handHorizVal">44</span>°</span>
            <input type="range" id="handHorizSlider" min="15" max="70" value="44" />
          </label>
          <label class="slider-row">
            <span>Up/down sector <span id="handVertVal">34</span>°</span>
            <input type="range" id="handVertSlider" min="15" max="70" value="34" />
          </label>
          <label class="slider-row">
            <span>Fingers curled <span id="handCurlVal">3</span>/4</span>
            <input type="range" id="handCurlSlider" min="1" max="4" value="3" />
          </label>
          <label class="slider-row">
            <span>Thumb clear of fist <span id="handOutVal">55</span>%</span>
            <input type="range" id="handOutSlider" min="15" max="90" value="55" />
          </label>
          <label class="slider-row">
            <span>Min thumb length <span id="handLenVal">22</span>%</span>
            <input type="range" id="handLenSlider" min="5" max="60" value="22" />
          </label>
          <label class="slider-row">
            <span>Thumb-at-me sensitivity <span id="handTowardVal">100</span>%</span>
            <input type="range" id="handTowardSlider" min="30" max="300" value="100" />
          </label>
          <label class="slider-row">
            <span>Frames to confirm <span id="handDebounceVal">1</span></span>
            <input type="range" id="handDebounceSlider" min="1" max="8" value="1" />
          </label>
        </div>
      </div>
    </div>

    <p class="hint">Arrow keys or WASD to move. Space to pause. R cycles weapon.</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
